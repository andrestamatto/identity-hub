plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'br.dev.andrestamatto'
version = '0.0.1-SNAPSHOT'

ext['flyway.version'] = '10.20.1'

ext {
    set('springCloudVersion', '2023.0.6')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.security:spring-security-crypto:6.3.1'
    implementation 'commons-codec:commons-codec:1.16.1'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'

    implementation "com.twilio.sdk:twilio:12.1.1"
    implementation "com.googlecode.libphonenumber:libphonenumber:9.0.32"

    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()

    def isFullSuite = {
        filter.includePatterns.empty &&
            filter.commandLineIncludePatterns.empty &&
            filter.excludePatterns.empty
    }

    afterSuite { descriptor, result ->
        if (descriptor.parent == null) {
            logger.lifecycle("Test gate: ${result.testCount} tests executed")

            if (isFullSuite() && result.testCount != 91) {
                throw new GradleException(
                    "Expected 91 tests, but ${result.testCount} were executed. " +
                        "Update this gate only when the test baseline changes intentionally."
                )
            }
        }
    }
}
