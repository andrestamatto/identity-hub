spring:
  application:
    name: identityhub-service
  datasource:
    url: ${IDENTITYHUB_DATABASE_URL}
    username: ${IDENTITYHUB_DATABASE_USERNAME}
    password: ${IDENTITYHUB_DATABASE_PASSWORD}
  flyway:
    enabled: true
  mail:
    host: ${IDENTITYHUB_SMTP_HOST:}
    port: ${IDENTITYHUB_SMTP_PORT:25}
    username: ${IDENTITYHUB_SMTP_USERNAME:}
    password: ${IDENTITYHUB_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${IDENTITYHUB_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${IDENTITYHUB_SMTP_STARTTLS:false}

identityhub:
  runtime:
    environment: ${IDENTITYHUB_ENVIRONMENT:development}
  security:
    admin:
      issuer-uri: ${IDENTITYHUB_ADMIN_ISSUER_URI}
      jwk-set-uri: ${IDENTITYHUB_ADMIN_JWK_SET_URI}
      audience: ${IDENTITYHUB_ADMIN_AUDIENCE}
  keycloak:
    management:
      enabled: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_ENABLED:false}
      base-uri: ${IDENTITYHUB_KEYCLOAK_BASE_URI:}
      realm: ${IDENTITYHUB_KEYCLOAK_REALM:}
      client-id: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_CLIENT_ID:}
      client-secret: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_CLIENT_SECRET:}
      poll-interval: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_POLL_INTERVAL:PT2S}
      lease-duration: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_LEASE_DURATION:PT30S}
      initial-retry-delay: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_INITIAL_RETRY_DELAY:PT5S}
      max-attempts: ${IDENTITYHUB_KEYCLOAK_MANAGEMENT_MAX_ATTEMPTS:5}
  communication:
    email:
      enabled: ${IDENTITYHUB_EMAIL_ENABLED:false}
      from-address: ${IDENTITYHUB_EMAIL_FROM_ADDRESS:}
      poll-interval: ${IDENTITYHUB_EMAIL_POLL_INTERVAL:PT2S}
      lease-duration: ${IDENTITYHUB_EMAIL_LEASE_DURATION:PT30S}
      initial-retry-delay: ${IDENTITYHUB_EMAIL_INITIAL_RETRY_DELAY:PT5S}
      max-attempts: ${IDENTITYHUB_EMAIL_MAX_ATTEMPTS:5}

management:
  endpoint:
    health:
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,keycloak
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
