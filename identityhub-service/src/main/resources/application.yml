spring:
  application:
    name: identityhub-service

identityhub:
  runtime:
    environment: ${IDENTITYHUB_ENVIRONMENT:development}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

server:
  shutdown: graceful

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
