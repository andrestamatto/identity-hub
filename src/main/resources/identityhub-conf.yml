identity-hub:
  security:
    rules:
      - pattern: /auth/**
        access: PERMIT_ALL
      - pattern: /**
        access: AUTHENTICATED
  jwt:
    default-identity-type: ${IDENTITY_HUB_DEFAULT_IDENTITY_TYPE:email}
    supported-identity-types:
      - email
      - cpf
      - ssn
      - username
      - external_id
  social-login:
    enabled: true
    providers:
      google:
        enabled: true
        default-redirect-url:
        allowed-redirect-urls: []
      github:
        enabled: true
        default-redirect-url:
        allowed-redirect-urls: []
      facebook:
        enabled: true
        default-redirect-url:
        allowed-redirect-urls: []
      linkedin:
        enabled: true
        default-redirect-url:
        allowed-redirect-urls: []
  local-identity-store:
    enabled: true
