identity-hub:
  security:
    api-secret: ${IDENTITY_HUB_API_SECRET:}
  policies:
    user-registration:
      username-type-policy:
        enable-verification-upon-registration: true
  notification:
    email:
      enabled: true
      provider: smtp
      from: no-reply@identityhub.dev
      smtp:
        host: 127.0.0.1
        port: 1025
        username:
        password:
        auth: false
        starttls: false
        connection-timeout: 3000
        read-timeout: 3000
        write-timeout: 3000
        max-attempts: 3
        retry-backoff-millis: 300
    sms:
      enabled: true
      provider: twilio
      providers:
        log:
        twilio:
          account-sid: ${TWILIO_ACCOUNT_SID:}
          auth-token: ${TWILIO_AUTH_TOKEN:}
          from: ${TWILIO_SMS_FROM:}
    whatsapp:
      enabled: true
      providers:
        twilio:
          account-sid: ${TWILIO_ACCOUNT_SID:}
          auth-token: ${TWILIO_AUTH_TOKEN:}
          from: ${TWILIO_WHATSAPP_FROM:}

