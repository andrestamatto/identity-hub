identity-hub:
  security:
    api-secret: ${IDENTITY_HUB_API_SECRET:temporaryUltraSecretValueForIdentityHubAPI}
  policies:
    user-registration:
      username-type-policy:
        enable-verification-upon-registration: true
  notification:
    email:
      enabled: true
      provider: smtp
      from: no-reply@identityhub.dev
      smtp:
        host: localhost
        port: 1025
        username:
        password:
        auth: false
        starttls: false
        connection-timeout: 3000
        read-timeout: 3000
        write-timeout: 3000
