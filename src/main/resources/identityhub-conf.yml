identity-hub:
  security:
    rules:
      - pattern: /auth/**
        access: PERMIT_ALL
      - pattern: /oauth2/authorize/**
        access: PERMIT_ALL
      - pattern: /oauth2/callback/**
        access: PERMIT_ALL
      - pattern: /**
        access: AUTHENTICATED
  jwt:
    default-identity-type: ${IDENTITY_HUB_DEFAULT_IDENTITY_TYPE:email}
    supported-identity-types:
      - email
      - cpf
      - ssn
      - username
      - external_id
  social-login:
    enabled: true
    providers:
      google:
        enabled: true
        base-uri: https://accounts.google.com/o/oauth2/v2/auth
        credentials:
          client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
          token-url: https://oauth2.googleapis.com
          user-info-url: https://openidconnect.googleapis.com
          scopes:
            - openid
            - profile
            - email
        default-redirect-url: http://localhost:8080/oauth2/callback/google
        allowed-redirect-urls: []
      github:
        enabled: false
        base-uri:
        credentials:
          client-id: YOUR_GITHUB_CLIENT_ID
          client-secret: YOUR_GITHUB_CLIENT_SECRET
          token-url: https://github.com
          user-info-url: https://api.github.com
          scopes: []
        default-redirect-url:
        allowed-redirect-urls: []
      facebook:
        enabled: false
        base-uri:
        credentials:
          client-id: YOUR_FACEBOOK_CLIENT_ID
          client-secret: YOUR_FACEBOOK_CLIENT_SECRET
          token-url: https://graph.facebook.com
          user-info-url: https://graph.facebook.com
          scopes: []
        default-redirect-url:
        allowed-redirect-urls: []
      linkedin:
        enabled: false
        base-uri:
        credentials:
          client-id: YOUR_LINKEDIN_CLIENT_ID
          client-secret: YOUR_LINKEDIN_CLIENT_SECRET
          token-url: https://www.linkedin.com
          user-info-url: https://api.linkedin.com
          scopes: []
        default-redirect-url:
        allowed-redirect-urls: []
  local-identity-store:
    enabled: true
