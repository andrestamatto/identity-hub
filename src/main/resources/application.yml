spring:
  config:
    import: optional:classpath:identityhub-conf.yml
  application:
    name: identity-hub
  datasource:
    url: jdbc:h2:file:./.data/identityhub;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

server:
  port: 8080

identity-hub:
  jwt:
    secret: ${IDENTITY_HUB_JWT_SECRET:8fd334bf75108aeb63c2bf1968c13e1d78df69a170d2d41496e524c3947078d1}
    access-token-expiration-seconds: ${IDENTITY_HUB_JWT_ACCESS_EXPIRATION_SECONDS:86400}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics


logging:
  level:
    org:
      springframework:
        security: DEBUG
